<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rail Auto-Booker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Rail Auto-Booker</h1>
    <p>Stops at the OTP screen. It never enters a code or pays.</p>
  </header>

  <form id="config-form">
    <label>
      From station
      <input id="fromStation" name="fromStation" list="station-list" autocomplete="off" placeholder="Dhaka" required>
    </label>
    <label>
      To station
      <input id="toStation" name="toStation" list="station-list" autocomplete="off" placeholder="Chattogram" required>
    </label>
    <datalist id="station-list"></datalist>

    <div class="row">
      <label>
        Journey date
        <input id="journeyDate" name="journeyDate" type="date" required>
      </label>
      <label>
        Class
        <select id="trainClass" name="trainClass" required>
          <option value="AC_B">AC_B — AC Berth</option>
          <option value="AC_S">AC_S — AC Seat</option>
          <option value="SNIGDHA">SNIGDHA — Snigdha</option>
          <option value="F_BERTH">F_BERTH — First Berth</option>
          <option value="F_SEAT">F_SEAT — First Seat</option>
          <option value="F_CHAIR">F_CHAIR — First Chair</option>
          <option value="S_CHAIR">S_CHAIR — Shovon Chair</option>
          <option value="SHOVAN">SHOVAN — Shovon</option>
          <option value="SHULOV">SHULOV — Shulov</option>
          <option value="AC_CHAIR">AC_CHAIR — AC Chair</option>
        </select>
      </label>
    </div>

    <label>
      Target train name or number
      <input id="targetTrain" name="targetTrain" placeholder="PARJOTAK EXPRESS (816)" required>
    </label>

    <div class="row">
      <label>
        Preferred coach
        <input id="preferredCoach" name="preferredCoach" placeholder="TA" maxlength="8">
      </label>
      <label>
        Seat quantity
        <input id="seatQuantity" name="seatQuantity" type="number" min="1" max="4" value="1" required>
      </label>
    </div>

    <label>
      Preferred seats
      <input id="preferredSeats" name="preferredSeats" placeholder="TA-49, TA-50">
    </label>

    <label>
      Boarding station
      <input id="boardingStation" name="boardingStation" list="station-list" autocomplete="off" placeholder="Blank = site default (origin)">
    </label>

    <label class="check">
      <input id="allowCoachFallback" name="allowCoachFallback" type="checkbox">
      If the preferred coach cannot fill the quantity, try the next coach with seats
    </label>

    <fieldset>
      <legend>Scheduled trigger</legend>
      <label>
        Date
        <input id="scheduleDate" name="scheduleDate" type="date" required>
      </label>
      <div class="time-row">
        <label>HH<input id="scheduleHour" name="scheduleHour" inputmode="numeric" maxlength="2" placeholder="08" required></label>
        <label>MM<input id="scheduleMinute" name="scheduleMinute" inputmode="numeric" maxlength="2" placeholder="00" required></label>
        <label>SS<input id="scheduleSecond" name="scheduleSecond" inputmode="numeric" maxlength="2" placeholder="00" required></label>
        <label>MS<input id="scheduleMs" name="scheduleMs" inputmode="numeric" maxlength="3" placeholder="000" required></label>
      </div>
    </fieldset>

    <p id="url-preview" class="preview"></p>
    <p id="form-message" class="form-message" hidden></p>

    <div class="actions">
      <button type="button" id="save-btn">Save Config</button>
      <button type="button" id="arm-btn" class="primary">Arm / Start Countdown</button>
      <button type="button" id="disarm-btn" class="danger">Cancel / Disarm</button>
    </div>
  </form>

  <section id="status-panel">
    <div class="status-line">
      <span id="phase-badge">IDLE</span>
      <span id="countdown">—</span>
    </div>
    <p id="drift"></p>
    <p id="last-log">No log yet.</p>
    <ol id="log-list"></ol>
  </section>

  <script src="utils/stations.js"></script>
  <script src="popup.js"></script>
</body>
</html>
